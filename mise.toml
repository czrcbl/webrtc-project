[tools]
go = "1.27.2"
mage = "1.17.2"
pnpm = "12.13.0"
python = "3.14"
tmux = "3.7c"
uv = "0.13.0"
"github:livekit/livekit-cli" = "2.19.2"
dotnet = "10.0.403"

[env]
_.python.venv = { path = ".venv", create = true } # Auto activate python env
_.path = "./repos/livekit-cli/bin"                # add lk cli to path

ENVIRONMENT = "dev"
DEBUG_RECORD_AUDIO = "false"
LIVEKIT_URL = "http://localhost:7880"
LIVEKIT_API_KEY = "devkey"
# LIVEKIT_API_SECRET = "secret"  # Bypass dotnet sdk limitation, secret is required to have 256 bits at least
LIVEKIT_API_SECRET = "a725efc3a6a7b2cc994038c96f89024818f8d09f2bdcc4f4a92e9005fcbf254c77485cf9cce2310c3f7e7a484e63dde8c942c998d6554aa983d179968ea0a995"

WHISPER_MODEL = "large-v3-turbo"                 # Better larger version: "large-v3-turbo"
WHISPER_SAMPLE_RATE = 16_000
WHISPER_COMPUTE_TYPE = "int8_float16"            # Reduce memory. ex: float16 
STT_WS_URL = "ws://localhost:8000/ws/transcribe"
STT_LANGUAGE = "pt"                              # empty -> auto-detect; set "en" / "pt" to pin

STT_PROVIDER = "deepgram" # "whisper"

[tasks.bootstrap]
description = """Prepare repo for development.
  Get all deps and run local copies.
"""
run = """
set -e
mkdir -p repos bin

[ -d repos/meet ]        || git clone git@github.com:czrcbl/meet.git repos/meet
[ -d repos/livekit ]     || git clone https://github.com/livekit/livekit repos/livekit

(cd repos/livekit && ./bootstrap.sh && mage)
"""

[tasks.server-dev]
description = "Run Livekit Server"
run = "./repos/livekit/bin/livekit-server --dev  --keys \"devkey: $LIVEKIT_API_SECRET\""  # --dev: Set up the api key and secret for the values o env

[tasks.meet-dev]
description = "Run Meet server"
run = "cd repos/meet && pnpm dev"  # dev: Set up the api key and secret for the values o env


[tasks.stt-server]
description = """
  Start a FastAPI server. It serves a Whisper model through a websocket.
  The command has a path hack in order to get Nvidia related deps from project's python env.
"""
run = """
  LD_LIBRARY_PATH="$(python -c 'import importlib; print(":".join(list(importlib.import_module(m).__path__)[0] for m in ("nvidia.cublas.lib","nvidia.cudnn.lib")))')${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" \
  WHISPER_DEVICE=cuda uv run python -m uvicorn services.stt_server.app:app --host 0.0.0.0 --port 8000 --reload
"""

[tasks.transcriber]
description = "Run the room transcriber"
run = "uv run services/transcriber/server.py"

[tasks.transcriber-en]
description = "Run the room transcriber with english preset"
run = "STT_LANGUAGE=en DEEPGRAM_LANGUAGE=en uv run services/transcriber/server.py"


[tasks.multi-sample]
description = "Join N fake speakers publishing speech: [--turns] [ROOM] [SPEAKERS] [LOOPS]"
run = "bash scripts/run_multi_sample.sh"

[tasks.net-transcriber-dev]
description = "Run the .NET transcriber in development mode (watch: hot reload, auto rebuild + restart)"
run = "DOTNET_USE_POLLING_FILE_WATCHER=1 ASPNETCORE_ENVIRONMENT=Development DOTNET_ENVIRONMENT=Development dotnet watch --project services/transcriber-net --non-interactive run"